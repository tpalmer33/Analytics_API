services:
  app:
    image: analytics-api:v1 # Name of created Docker image
    build:
      context: .
      dockerfile: Dockerfile
    # environment:
    #   - PORT=8002
    env_file:
      - .env
    ports:
      - "8002:8002" # Host and container ports
    command: uvicorn main:app --host 0.0.0.0 --port 8002 --reload # Server start up command
    volumes:
      - ./src:/code:rw # Path to persisted server data
    develop:
      watch: # Actions to take when files are updated and watch flag is set
        - action: rebuild
          path: Dockerfile
        - action: rebuild
          path: requirements.txt
        - action: rebuild
          path: compose.yaml
  # postgresql+psycopg://time-user:time-pw@hostvalue:5432/timescaledb
  db_service:
    image: timescale/timescaledb:latest-pg17 # Database image from DockerHub
    environment: # Database credentials
      - POSTGRES_USER=time-user
      - POSTGRES_PASSWORD=time-pw
      - POSTGRES_DB=timescaledb
    ports:
      - "5432:5432" # Host port and container port
    expose:
      - 5432 # Exposed port available to other containers in the network
    volumes:
      - timescaledb_data:/var/lib/postgresql/data # Path to persisted data

volumes:
  timescaledb_data: